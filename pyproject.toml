[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate-local"
version = "0.1.0"
description = "Local, instrumented DataMate solver and isolated evaluator"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<3", "openpyxl>=3.1,<4", "pyarrow>=19,<25", "numpy>=2.1,<3",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "sqlglot>=27,<40", "python-calamine>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
datamate = "datamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
